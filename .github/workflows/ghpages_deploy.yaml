name: Публикация витрины

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v7

      - name: Установка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Установка зависимостей
        run: npm install

      - name: Сборка проекта
        run: npm run build

      # Повтор прогона оставляет от прошлой попытки второй артефакт github-pages, и deploy-pages падает на двух
      - name: Удаление артефактов прошлых попыток
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IDS=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "github-pages") | .id')
          for id in $IDS; do
            echo "Удаление артефакта $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - name: Настройка Pages
        uses: actions/configure-pages@v6

      - name: Загрузка артефактов
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./docs"

      # deploy-pages запускается сразу после загрузки и не видит еще не зарегистрированный артефакт: ждем, пока он появится
      - name: Ожидание регистрации артефакта
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            COUNT=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            echo "Попытка $i: артефактов github-pages = $COUNT"
            if [ "$COUNT" -eq 1 ]; then exit 0; fi
            sleep 2
          done
          echo "Артефакт github-pages не зарегистрировался за минуту" >&2
          exit 1

      - name: Развертывание GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
