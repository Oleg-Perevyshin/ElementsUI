# .github/workflows/npm_publish.yaml
name: Публикация в NPM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # Публикация библиотеки в npmjs
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish]')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v7

      - name: Установка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Обновление npm
        run: npm install -g npm@latest

      - name: Установка зависимостей
        run: npm install

      - name: Сборка библиотеки
        run: npm run prepack

      - name: Публикация в NPM
        run: npm publish --access public

  # Обновление версии библиотеки в DevCloud и переразвётывание облака
  update-devcloud:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Клонирование библиотеки
        uses: actions/checkout@v7

      - name: Установка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Ожидание версии в реестре npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            [ "$(npm view poe-svelte-ui-lib@$VERSION version 2>/dev/null)" = "$VERSION" ] && exit 0
            sleep 15
          done
          echo "Версия $VERSION не появилась в npm за 10 минут" && exit 1

      - name: Клонирование DevCloud
        env:
          DEVCLOUD_ACCESS_TOKEN: ${{ secrets.DEVCLOUD_ACCESS_TOKEN }}
        run: git clone --depth 1 "https://oauth2:${DEVCLOUD_ACCESS_TOKEN}@git.xpoe.pro/xPOE-Studio/DevCloud.git" devcloud

      - name: Обновление библиотеки и проверка типов
        working-directory: devcloud
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
        run: |
          npm install "poe-svelte-ui-lib@$VERSION"
          npx svelte-kit sync
          npx prisma generate
          npx svelte-check --threshold error

      - name: Коммит с развёртыванием облака
        working-directory: devcloud
        run: |
          git diff --quiet package.json package-lock.json && echo "Версия уже актуальна" && exit 0
          git config user.name "${{ github.event.head_commit.author.name || github.actor }}"
          git config user.email "${{ github.event.head_commit.author.email || format('{0}@users.noreply.github.com', github.actor) }}"
          git add package.json package-lock.json
          git commit -m "ReDeploy облака (обновление ElementsUI до $VERSION) [deploy]"
          git push origin HEAD:main
