# .github/workflows/npm_publish.yaml
# Публикация через trusted publisher npm (OIDC): токен NPM_TOKEN не нужен, provenance добавляется автоматически.
# Связь на npmjs.com: Oleg-Perevyshin/ElementsUI, workflow npm_publish.yaml, разрешение «npm publish».
name: Публикация в NPM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC-токен для trusted publishing

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Обновление npm (trusted publishing требует npm 11.5.1+)
        run: npm install -g npm@latest

      - name: Установка зависимостей
        run: npm install

      - name: Сборка библиотеки
        run: npm run prepack

      - name: Публикация в NPM
        run: npm publish --access public
