# .github/workflows/knowledgebase.yaml
name: Справочник для ИИ

# Каждый push в main: KnowledgeBase-ElementsUI.md должен совпадать со сборкой node .knowledgebase/build.mjs
on:
  push:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v7

      - name: Установка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Сверка справочника
        run: node .knowledgebase/build.mjs --check
