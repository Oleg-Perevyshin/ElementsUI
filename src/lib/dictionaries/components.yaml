# Список компонентов GUI устройства - единый для библиотеки, облака, терминала и прошивок
# Строка: - [Тип, обмен с устройством]   # описание. Тип - значение type в GUI (web_ui.yaml.gz) и имя экспорта компонента в poe-svelte-ui-lib
# Обмен: none - оформление, read - показывает переменную properties.id, write - только отправляет команду, readWrite - показывает и меняет, widget - смарт-виджет с набором полей группы
# Источник - poe-svelte-ui-lib (src/lib/dictionaries/components.yaml); .framework/Components.yaml фреймворков - копии, не править
# После правки - npm run Generate (generated/components.ts), затем копии во фреймворки

components:
  # Контейнеры и оформление
  - [Accordion, none]          # сворачиваемая группа блоков
  - [Tabs, none]               # вкладки с блоками
  - [TextField, none]          # текст
  - [Divider, none]            # разделитель
  # Управление
  - [Button, write]            # кнопка команды
  - [FileAttach, write]        # передача файла в устройство
  - [Input, readWrite]         # поле ввода
  - [Select, readWrite]        # выбор из списка или кнопками
  - [Switch, readWrite]        # переключатель
  - [Slider, readWrite]        # ползунок
  - [Joystick, readWrite]      # джойстик
  - [Widget, readWrite]        # значок с состоянием
  # Отображение
  - [ProgressBar, read]        # шкала
  - [Graph, read]              # график
  - [PeriodChart, read]        # столбики по периодам
  - [Table, read]              # таблица
  - [VideoViewer, none]        # видео
  # Смарт-виджеты
  - [WidgetWiFi, widget]       # настройки Wi-Fi
  - [WidgetDeviceInfo, widget] # об устройстве
  - [WidgetFileSystem, widget] # файлы устройства
  - [WidgetStackInfo, widget]  # задачи и память
  - [WidgetRGBStrip, widget]   # светодиодная лента
  - [WidgetPFD, widget]        # пилотажный прибор
  - [WidgetMap, widget]        # карта
