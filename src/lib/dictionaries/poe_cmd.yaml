# Словарь аргументов протокола (поле arg в HAR, 0..8191) - единый для всех устройств, обоих фреймворков и приложений, на шине и в WebSocket-конверте {HAR, VAL}
# Строка: Строковое представление аргумента | Название в перечислении | Числовой код | Важность на CAN (у команд устройств обязательна, у команд облака не нужна)
# Важность: 0 - самое важное (перезагрузка, сброс настроек, обновление прошивки, включение привода), 1 - служебные команды, настройки и основная работа (уставки приводов, ориентация), 2 - вспомогательные потоки и данные (потоки и телеметрия модулей, файлы), 3 - графики, отладка и поток данных для интерфейса
# Имя - полными словами, сначала группа (System, Debug, Network, Cloud, Module, Firmware, Motion, Orientation, Chat, Device), затем действие; перечисление - A_ и то же имя заглавными через подчёркивание (у команд облака A_CLOUD_)
# Диапазоны: 0..4095 - устройства (команды прошивок), 4096..6999 - резерв, 7000..7999 - облако DevCloud (команды самого облака, не устройств), 8000..8191 - резерв
# Источник - xPOE-Stack Lib (src/lib/dictionaries/poe_cmd.yaml); .framework/poe_cmd.yaml фреймворков - копии, не править

# 0 - отсутствие аргумента
- [Unknown, A_UNKNOWN, 0, 2] # Аргумент отсутствует

# Служебные команды и отладка
- [SystemRestart, A_SYSTEM_RESTART, 1, 0]              # SET: перезагрузка устройства
- [SystemDefaultConfig, A_SYSTEM_DEFAULT_CONFIG, 2, 0] # SET: сброс конфигурации к заводской
- [FirmwareDownload, A_FIRMWARE_DOWNLOAD, 3, 2]        # SET: скачивание прошивки с сервера (http_client)
- [SystemFileSystem, A_SYSTEM_FILE_SYSTEM, 4, 2]       # Файловая система: GET - снимок, SET {Op: Delete|UploadStart|UploadChunk|UploadDone|DownloadStart|DownloadChunk|DownloadDone}
- [SystemResetStorage, A_SYSTEM_RESET_STORAGE, 5, 0]   # SET: очистка хранилища настроек (NVS/Flash) и перезагрузка
- [SystemLocalTime, A_SYSTEM_LOCAL_TIME, 6, 1]         # GET: локальное время устройства
- [SystemDataUpdate, A_SYSTEM_DATA_UPDATE, 7, 3]       # OK!/ER!: обновление данных в интерфейсе (DevCloud ретранслирует SystemDataStream)
- [SystemStackInfo, A_SYSTEM_STACK_INFO, 8, 1]         # GET: снимок куч и стеков задач
- [SystemBackup, A_SYSTEM_BACKUP, 9, 1]                # Резервная копия конфигурации
- [ModuleBindKey, A_MODULE_BIND_KEY, 10, 1]            # SET: привязка ключа модуля (ModBindKey)
- [DebugLog, A_DEBUG_LOG, 11, 3]                       # OK!: сообщение отладки - CBOR-массив [уровень, тег, текст|байты, FHS]
- [DebugPlot, A_DEBUG_PLOT, 12, 3]                     # OK!: значения графиков отладки - CBOR-карта {"Имя": float32} (LOG_PLOT)
- [DebugMirror, A_DEBUG_MIRROR, 13, 3]                 # OK!: копия пакета другого интерфейса в консоль (уровень TRACE) - {Dir, If, Trg, Src, HAR, ModSN, Val}
- [SystemDataStream, A_SYSTEM_DATA_STREAM, 15, 3]      # OK!: поток данных групп конфигурации (CS_PushGroupStream)

# Локальная сеть и подключение к облаку
- [NetworkAccessPoints, A_NETWORK_ACCESS_POINTS, 21, 2] # GET: список точек доступа Wi-Fi
- [CloudJoinDevice, A_CLOUD_JOIN_DEVICE, 23, 1]         # SET: подтверждение подключения устройства к облаку
- [CloudJoinUser, A_CLOUD_JOIN_USER, 24, 1]             # SET: пользователь подключился к устройству
- [CloudLeaveUser, A_CLOUD_LEAVE_USER, 25, 1]           # SET: пользователь отключился от устройства

# Модули в рамках изделия
- [ModuleFind, A_MODULE_FIND, 31, 1]              # GET/OK!: поиск модулей на шинах изделия
- [ModuleList, A_MODULE_LIST, 32, 1]              # Список модулей изделия (CFG.ModList)
- [ModuleCapture, A_MODULE_CAPTURE, 33, 1]        # GET/OK!: захват модуля для привязки
- [ModuleInfo, A_MODULE_INFO, 34, 1]              # GET/OK!: информация о модуле
- [ModuleMode, A_MODULE_MODE, 35, 1]              # SET: режим работы модуля
- [ModuleConfig, A_MODULE_CONFIG, 36, 1]          # GET/SET: конфигурация модуля (группы config_service)
- [ModuleTelemetry1, A_MODULE_TELEMETRY_1, 37, 2] # Телеметрия модуля, канал 1
- [ModuleTelemetry2, A_MODULE_TELEMETRY_2, 38, 2] # Телеметрия модуля, канал 2
- [ModuleTelemetry3, A_MODULE_TELEMETRY_3, 39, 2] # Телеметрия модуля, канал 3
- [ModuleTelemetry4, A_MODULE_TELEMETRY_4, 40, 2] # Телеметрия модуля, канал 4
- [ModuleTelemetry5, A_MODULE_TELEMETRY_5, 41, 2] # Телеметрия модуля, канал 5
- [ModuleStream1, A_MODULE_STREAM_1, 42, 2]       # Поток данных модуля, канал 1
- [ModuleStream2, A_MODULE_STREAM_2, 43, 2]       # Поток данных модуля, канал 2
- [ModuleStream3, A_MODULE_STREAM_3, 44, 2]       # Поток данных модуля, канал 3
- [ModuleStream4, A_MODULE_STREAM_4, 45, 2]       # Поток данных модуля, канал 4
- [ModuleStream5, A_MODULE_STREAM_5, 46, 2]       # Поток данных модуля, канал 5

# Обновление прошивки
- [FirmwareUpgradeStart, A_FIRMWARE_UPGRADE_START, 51, 0] # Старт обновления: размер и CRC32 образа; приложение уходит в загрузчик, загрузчик стирает место и читает образ сам
- [FirmwareUpgradeRead, A_FIRMWARE_UPGRADE_READ, 52, 0]   # Загрузчик читает кусок образа у сервера (хаб, терминал): смещение и длина, ответ - смещение и данные
- [FirmwareUpgradeDone, A_FIRMWARE_UPGRADE_DONE, 53, 0]   # Итог обновления от загрузчика серверу: OK! - CRC32 сошлась, приложение запущено

# Работа с модулями перемещения (оси подвесов, линейные перемещения, серво приводы и подобные)
- [MotionEnable, A_MOTION_ENABLE, 111, 0]       # SET: привод - число 1 (включить, держит текущий угол) или 0 (фазы без напряжения, драйвер спит)
- [MotionMode, A_MOTION_MODE, 112, 1]           # SET: режим управления - число: 0 момент, 1 скорость, 2 угол, 3 скорость без обратной связи, 4 угол без обратной связи; продолжает с текущего состояния
- [MotionTarget, A_MOTION_TARGET, 113, 1]       # SET: цель в единицах текущего режима (число: В или А, рад/с, рад); с флагом ответа - OK! с состоянием оси (angle, vel, iq, flags)
- [MotionInfo, A_MOTION_INFO, 115, 1]           # GET: состояние оси - карта Angle, Vel, Target (рад, рад/с), Iq, Id (А), Uq, Ud (В), Mode, Torq, Flags
- [MotionCalibrate, A_MOTION_CALIBRATE, 117, 1] # SET: калибровка нуля и направления мотора без рывков, результат сохраняется (тело {})
- [MotionVelocity, A_MOTION_VELOCITY, 118, 1]   # SET: уставка скорости оси, рад/с (число); с флагом ответа - OK! с состоянием оси (angle, vel, iq, flags)
- [MotionAngle, A_MOTION_ANGLE, 119, 1]         # SET: уставка угла оси, рад (число); с флагом ответа - OK! с состоянием оси (angle, vel, iq, flags)
- [MotionHome, A_MOTION_HOME, 120, 1]           # SET: плавный выход оси в начальное положение (MOT.M_Home со скоростью MOT.M_HSpd) с обратной связью (тело {})

# Работа с модулями ориентации (IMU, магнетометры, GNSS и подобные)
- [OrientationData, A_ORIENTATION_DATA, 141, 1]                              # SET: углы ориентации от модуля
- [OrientationOffset, A_ORIENTATION_OFFSET, 142, 1]                          # Смещения ориентации
- [OrientationAccelCalibrate, A_ORIENTATION_ACCEL_CALIBRATE, 143, 1]         # Калибровка акселерометра
- [OrientationMagCalibrate, A_ORIENTATION_MAG_CALIBRATE, 144, 1]             # Калибровка магнетометра
- [OrientationGyroscopeCalibrate, A_ORIENTATION_GYROSCOPE_CALIBRATE, 145, 1] # Калибровка гироскопа

# Облако DevCloud (7000..7999): команды самого облака по /ws, устройства их не получают
# Чаты (7000..7099)
- [ChatMessage, A_CLOUD_CHAT_MESSAGE, 7000]              # SET: новое сообщение в чат (браузер - облако - участники)
- [ChatMessages, A_CLOUD_CHAT_MESSAGES, 7001]            # GET/OK!: страница истории чата
- [ChatSystemMessage, A_CLOUD_CHAT_SYSTEM_MESSAGE, 7002] # SET: сообщение в системный чат (администратор)
- [ChatEditMessage, A_CLOUD_CHAT_EDIT_MESSAGE, 7003]     # SET/OK!: правка своего сообщения
- [ChatDeleteMessage, A_CLOUD_CHAT_DELETE_MESSAGE, 7004] # SET/OK!: удаление своего сообщения
- [ChatLastRead, A_CLOUD_CHAT_LAST_READ, 7005]           # SET: чат прочитан, вкладка чата закрыта
- [ChatJoin, A_CLOUD_CHAT_JOIN, 7006]                    # SET/OK!: вход в чат
- [ChatUserConnected, A_CLOUD_CHAT_USER_CONNECTED, 7007] # SET: собеседник открыл чат
- [ChatUnread, A_CLOUD_CHAT_UNREAD, 7008]                # OK!: число непрочитанных в чате
- [ChatPins, A_CLOUD_CHAT_PINS, 7009]                    # OK!: закреплённые чаты пользователя
- [ChatEditGroup, A_CLOUD_CHAT_EDIT_GROUP, 7010]         # OK!: чат создан или изменён
- [ChatRemoveUser, A_CLOUD_CHAT_REMOVE_USER, 7011]       # OK!: пользователь удалён из чата

# Устройства в облаке (7100..7199)
- [DeviceMessages, A_CLOUD_DEVICE_MESSAGES, 7100]        # GET/OK!: страница журнала устройства
- [DeviceConnection, A_CLOUD_DEVICE_CONNECTION, 7101]    # OK!: устройство в сети или ушло из сети
- [DeviceLeaveGroup, A_CLOUD_DEVICE_LEAVE_GROUP, 7102]   # SET/OK!: выход из группы устройства
- [DeviceLeaveGroups, A_CLOUD_DEVICE_LEAVE_GROUPS, 7103] # SET: выход из групп всех устройств
- [DeviceResetToken, A_CLOUD_DEVICE_RESET_TOKEN, 7104]   # SET/OK!: сброс токена устройства (TOFU)
